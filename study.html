<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UniFlow - Study Hours</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* SUMMARY */

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .summary-card h3 {
            color: #777;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .summary-card h2 {
            font-size: 28px;
        }

        /* SECTIONS */

        .section {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            border: none;
            background: #667eea;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #5568d9;
        }

        /* PROGRESS */

        .progress-box {
            margin-top: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: #eee;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #667eea;
            transition: 0.4s;
        }

        .progress-text {
            margin-top: 8px;
            color: #777;
        }

        /* SUBJECTS */

        .subject {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .subject:last-child {
            border-bottom: none;
        }

        .subject-info strong {
            display: block;
            margin-bottom: 5px;
        }

        .subject-info small {
            color: #777;
        }

        .delete-btn {
            background: #ff5c5c;
            padding: 8px 12px;
            font-size: 13px;
        }

        .delete-btn:hover {
            background: #e04444;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 20px;
        }

        /* TIMER */

        .timer {
            text-align: center;
        }

        .timer-display {
            font-size: 55px;
            font-weight: bold;
            margin: 20px 0;
        }

        .timer-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .stop-btn {
            background: #ff9f43;
        }

        .reset-btn {
            background: #777;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .summary {
                grid-template-columns: 1fr;
            }

            .subject {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .timer-display {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>📚 UniFlow Study Hours</h1>

    <a href="dashboard.html" class="back">
        ← Dashboard
    </a>

</header>


<div class="container">


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-card">

            <h3>Today's Goal</h3>

            <h2 id="goalDisplay">
                0 hrs
            </h2>

        </div>


        <div class="summary-card">

            <h3>Studied Today</h3>

            <h2 id="studiedDisplay">
                0 hrs
            </h2>

        </div>


        <div class="summary-card">

            <h3>Progress</h3>

            <h2 id="progressDisplay">
                0%
            </h2>

        </div>

    </div>


    <!-- SET GOAL -->

    <div class="section">

        <h2>Set Daily Study Goal</h2>

        <input
            type="number"
            id="goalInput"
            placeholder="Example: 5"
            min="0"
            step="0.5"
        >

        <button onclick="setGoal()">
            Save Goal
        </button>

    </div>


    <!-- STUDY PROGRESS -->

    <div class="section">

        <h2>Study Progress</h2>

        <div class="progress-box">

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    id="progressFill"
                ></div>

            </div>

            <p
                class="progress-text"
                id="progressText"
            >
                0 hours studied
            </p>

        </div>

    </div>


    <!-- ADD SUBJECT -->

    <div class="section">

        <h2>Add Subject</h2>

        <input
            type="text"
            id="subjectName"
            placeholder="Subject name"
        >

        <input
            type="number"
            id="subjectHours"
            placeholder="Planned hours"
            min="0"
            step="0.5"
        >

        <button onclick="addSubject()">
            + Add Subject
        </button>

    </div>


    <!-- SUBJECT LIST -->

    <div class="section">

        <h2>My Subjects</h2>

        <div id="subjectList"></div>

    </div>


    <!-- TIMER -->

    <div class="section timer">

        <h2>🍅 Study Timer</h2>

        <p>
            Focus for 25 minutes
        </p>

        <div
            class="timer-display"
            id="timerDisplay"
        >
            25:00
        </div>


        <div class="timer-buttons">

            <button onclick="startTimer()">
                Start
            </button>

            <button
                class="stop-btn"
                onclick="stopTimer()"
            >
                Stop
            </button>

            <button
                class="reset-btn"
                onclick="resetTimer()"
            >
                Reset
            </button>

        </div>

    </div>

</div>


<script>

    /* LOAD SAVED DATA */

    let goal =
        Number(
            localStorage.getItem(
                "uniflowStudyGoal"
            )
        ) || 0;


    let studied =
        Number(
            localStorage.getItem(
                "uniflowStudied"
            )
        ) || 0;


    let subjects =
        JSON.parse(
            localStorage.getItem(
                "uniflowSubjects"
            )
        ) || [];


    /* SAVE DATA */

    function saveData() {

        localStorage.setItem(
            "uniflowStudyGoal",
            goal
        );

        localStorage.setItem(
            "uniflowStudied",
            studied
        );

        localStorage.setItem(
            "uniflowSubjects",
            JSON.stringify(subjects)
        );
    }


    /* SET GOAL */

    function setGoal() {

        const value =
            Number(
                document.getElementById(
                    "goalInput"
                ).value
            );


        if (value <= 0) {

            alert(
                "Please enter a valid study goal."
            );

            return;
        }


        goal = value;

        saveData();

        document.getElementById(
            "goalInput"
        ).value = "";

        updateDisplay();
    }


    /* ADD SUBJECT */

    function addSubject() {

        const name =
            document.getElementById(
                "subjectName"
            ).value.trim();


        const hours =
            Number(
                document.getElementById(
                    "subjectHours"
                ).value
            );


        if (!name || hours <= 0) {

            alert(
                "Please enter subject name and planned hours."
            );

            return;
        }


        subjects.push({

            id: Date.now(),

            name: name,

            hours: hours

        });


        saveData();


        document.getElementById(
            "subjectName"
        ).value = "";


        document.getElementById(
            "subjectHours"
        ).value = "";


        displaySubjects();
    }


    /* DELETE SUBJECT */

    function deleteSubject(id) {

        subjects =
            subjects.filter(
                subject =>
                    subject.id !== id
            );


        saveData();

        displaySubjects();
    }


    /* DISPLAY SUBJECTS */

    function displaySubjects() {

        const list =
            document.getElementById(
                "subjectList"
            );


        if (subjects.length === 0) {

            list.innerHTML =
                '<div class="empty">No subjects added yet.</div>';

            return;
        }


        list.innerHTML = "";


        subjects.forEach(subject => {

            const div =
                document.createElement(
                    "div"
                );


            div.className = "subject";


            div.innerHTML = `

                <div class="subject-info">

                    <strong>
                        ${escapeHTML(subject.name)}
                    </strong>

                    <small>
                        Planned: ${subject.hours} hrs
                    </small>

                </div>

                <button
                    class="delete-btn"
                    onclick="deleteSubject(${subject.id})"
                >
                    Delete
                </button>

            `;


            list.appendChild(div);

        });
    }


    /* UPDATE DISPLAY */

    function updateDisplay() {

        document.getElementById(
            "goalDisplay"
        ).textContent =
            goal + " hrs";


        document.getElementById(
            "studiedDisplay"
        ).textContent =
            studied + " hrs";


        let progress = 0;


        if (goal > 0) {

            progress =
                Math.round(
                    (studied / goal) * 100
                );

        }


        if (progress > 100) {

            progress = 100;

        }


        document.getElementById(
            "progressDisplay"
        ).textContent =
            progress + "%";


        document.getElementById(
            "progressFill"
        ).style.width =
            progress + "%";


        document.getElementById(
            "progressText"
        ).textContent =
            studied +
            " hours studied";

    }


    /* TIMER */

    let time = 25 * 60;

    let timerInterval = null;


    function updateTimer() {

        const minutes =
            Math.floor(time / 60);


        const seconds =
            time % 60;


        document.getElementById(
            "timerDisplay"
        ).textContent =

            String(minutes).padStart(2, "0")
            + ":" +
            String(seconds).padStart(2, "0");
    }


    function startTimer() {

        if (timerInterval !== null) {
            return;
        }


        timerInterval =
            setInterval(function() {

                time--;

                updateTimer();


                if (time <= 0) {

                    clearInterval(
                        timerInterval
                    );

                    timerInterval = null;


                    // Add 0.5 hour
                    studied += 0.5;

                    saveData();

                    updateDisplay();


                    alert(
                        "25 minutes completed! 🎉"
                    );


                    resetTimer();

                }

            }, 1000);
    }


    function stopTimer() {

        clearInterval(
            timerInterval
        );

        timerInterval = null;
    }


    function resetTimer() {

        stopTimer();

        time = 25 * 60;

        updateTimer();
    }


    /* SECURITY */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    /* INITIAL LOAD */

    updateDisplay();

    displaySubjects();

    updateTimer();

</script>

</body>
</html>
