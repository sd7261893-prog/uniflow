<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UniFlow - Budget</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        /* HEADER */
        header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* MAIN */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* SUMMARY */
        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .summary-card h3 {
            color: #777;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .summary-card h2 {
            font-size: 28px;
        }

        /* SECTIONS */
        .section {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        /* INPUTS */
        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            border: none;
            background: #667eea;
            color: white;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background: #5568d9;
        }

        /* EXPENSE FORM */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        /* EXPENSE LIST */
        .expense {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .expense:last-child {
            border-bottom: none;
        }

        .expense-info strong {
            display: block;
            margin-bottom: 5px;
        }

        .expense-info small {
            color: #777;
        }

        .expense-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .amount {
            font-weight: bold;
        }

        .delete-btn {
            background: #ff5c5c;
            padding: 8px 12px;
            font-size: 13px;
        }

        .delete-btn:hover {
            background: #e04444;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 20px;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            .summary {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 18px;
            }

            header h1 {
                font-size: 20px;
            }

            .expense {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .expense-right {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>💰 UniFlow Budget Planner</h1>

        <a href="dashboard.html" class="back">
            ← Dashboard
        </a>
    </header>


    <div class="container">

        <!-- SUMMARY -->
        <div class="summary">

            <div class="summary-card">
                <h3>Monthly Budget</h3>
                <h2 id="budgetDisplay">₹0</h2>
            </div>

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <h2 id="expenseDisplay">₹0</h2>
            </div>

            <div class="summary-card">
                <h3>Remaining Money</h3>
                <h2 id="remainingDisplay">₹0</h2>
            </div>

        </div>


        <!-- SET BUDGET -->
        <div class="section">

            <h2>Set Monthly Budget</h2>

            <input
                type="number"
                id="budgetInput"
                placeholder="Enter your monthly budget"
                min="0"
            >

            <button onclick="setBudget()">
                Save Budget
            </button>

        </div>


        <!-- ADD EXPENSE -->
        <div class="section">

            <h2>Add Expense</h2>

            <div class="form-grid">

                <div>
                    <input
                        type="text"
                        id="expenseName"
                        placeholder="Expense name"
                    >
                </div>

                <div>
                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="Amount"
                        min="0"
                    >
                </div>

                <div>
                    <select id="expenseCategory">

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Study">
                            Study
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>
                </div>

            </div>

            <button onclick="addExpense()">
                + Add Expense
            </button>

        </div>


        <!-- EXPENSE HISTORY -->
        <div class="section">

            <h2>Expense History</h2>

            <div id="expenseList">
            </div>

        </div>

    </div>


    <script>

        /* LOAD SAVED DATA */

        let budget =
            Number(localStorage.getItem("uniflowBudget")) || 0;

        let expenses =
            JSON.parse(
                localStorage.getItem("uniflowExpenses")
            ) || [];


        /* SAVE DATA */

        function saveData() {

            localStorage.setItem(
                "uniflowBudget",
                budget
            );

            localStorage.setItem(
                "uniflowExpenses",
                JSON.stringify(expenses)
            );
        }


        /* SET BUDGET */

        function setBudget() {

            const input =
                document.getElementById("budgetInput");

            const value =
                Number(input.value);

            if (value <= 0) {

                alert("Please enter a valid budget.");

                return;
            }

            budget = value;

            saveData();

            input.value = "";

            updateDisplay();
        }


        /* ADD EXPENSE */

        function addExpense() {

            const name =
                document.getElementById("expenseName").value.trim();

            const amount =
                Number(
                    document.getElementById("expenseAmount").value
                );

            const category =
                document.getElementById("expenseCategory").value;


            if (!name || amount <= 0 || !category) {

                alert(
                    "Please enter expense name, amount and category."
                );

                return;
            }


            const expense = {

                id: Date.now(),

                name: name,

                amount: amount,

                category: category

            };


            expenses.push(expense);

            saveData();


            document.getElementById("expenseName").value = "";

            document.getElementById("expenseAmount").value = "";

            document.getElementById("expenseCategory").value = "";


            updateDisplay();
        }


        /* DELETE EXPENSE */

        function deleteExpense(id) {

            expenses =
                expenses.filter(
                    expense => expense.id !== id
                );

            saveData();

            updateDisplay();
        }


        /* UPDATE SCREEN */

        function updateDisplay() {

            const totalExpenses =
                expenses.reduce(
                    (total, expense) =>
                        total + expense.amount,
                    0
                );


            const remaining =
                budget - totalExpenses;


            document.getElementById(
                "budgetDisplay"
            ).textContent =
                "₹" + budget.toLocaleString("en-IN");


            document.getElementById(
                "expenseDisplay"
            ).textContent =
                "₹" + totalExpenses.toLocaleString("en-IN");


            document.getElementById(
                "remainingDisplay"
            ).textContent =
                "₹" + remaining.toLocaleString("en-IN");


            displayExpenses();
        }


        /* DISPLAY EXPENSES */

        function displayExpenses() {

            const list =
                document.getElementById("expenseList");


            if (expenses.length === 0) {

                list.innerHTML =
                    '<div class="empty">No expenses added yet.</div>';

                return;
            }


            list.innerHTML = "";


            expenses
                .slice()
                .reverse()
                .forEach(expense => {

                    const div =
                        document.createElement("div");

                    div.className = "expense";


                    div.innerHTML = `

                        <div class="expense-info">

                            <strong>
                                ${escapeHTML(expense.name)}
                            </strong>

                            <small>
                                ${escapeHTML(expense.category)}
                            </small>

                        </div>

                        <div class="expense-right">

                            <span class="amount">
                                ₹${expense.amount.toLocaleString("en-IN")}
                            </span>

                            <button
                                class="delete-btn"
                                onclick="deleteExpense(${expense.id})"
                            >
                                Delete
                            </button>

                        </div>

                    `;


                    list.appendChild(div);

                });
        }


        /* SECURITY */

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }


        /* LOAD DATA WHEN PAGE OPENS */

        updateDisplay();

    </script>

</body>
</html>
