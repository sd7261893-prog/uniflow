<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFlow - Student Life Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">📚</div>

            <h1>UniFlow</h1>
            <p class="subtitle">Plan your day. Achieve your goals.</p>

            <form id="loginForm">

                <label>Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter your password"
                    required
                >

                <div class="remember">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">Login</button>

            </form>

            <p id="message"></p>

            <p class="signup">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
